<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>幸运硬币选择</title>
    <link rel="stylesheet" href="css/coin.css" />
  </head>
  <body>
    <main id="app">
      <!-- 顶部标题行（PL007.1）：常驻小标题，5 秒认知兜底 -->
      <header id="title-bar" aria-label="应用标题">
        <h1>幸运硬币</h1>
        <p>抛硬币，替你做决定</p>
      </header>

      <!-- 硬币区（核心交互，占剩余空间） -->
      <section id="coin-stage" aria-label="硬币区">
        <p id="swipe-hint">左右滑动 · 抛硬币</p>
        <div id="coin-scene">
          <div id="coin">
            <div class="face face-yes"></div>
            <div class="face face-no"></div>
          </div>
        </div>
      </section>

      <!-- 结果展示区 -->
      <section id="result-area" aria-label="结果区">
        <div id="round-result"></div>
      </section>

      <!-- 底部功能区（PL008：战绩记录 / 换硬币） -->
      <footer id="bottom-bar">
        <button type="button" id="history-btn">战绩</button>
        <button type="button" id="settings-btn">换硬币</button>
      </footer>
    </main>

    <!-- 浮层容器（战绩/设置）与轻提示 -->
    <div id="overlay" hidden aria-hidden="true"></div>
    <div id="toast" hidden role="status"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
